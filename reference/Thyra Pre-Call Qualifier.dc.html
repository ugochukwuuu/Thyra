<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box} body{margin:0} a{color:#D9714E;text-decoration:none} a:hover{color:#C25E3D}</style>
</helmet>
<div style="--cream:#F5F1E7; --paper:#FBFAF6; --charcoal:#1A1714; --terra:#D9714E; --terra-dark:#C25E3D; --grey:#6B655C; --line:rgba(26,23,20,0.12); --hd:'Geist',system-ui,sans-serif; --bd:'Hanken Grotesk',system-ui,sans-serif; font-family:var(--bd); color:#1A1714; background:var(--cream); min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.5;">
  <header style="position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:16px; padding:14px 24px; background:rgba(245,241,231,0.86); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);">
    <div style="display:flex; align-items:center; gap:10px; font-family:var(--hd); font-weight:700; font-size:18px; letter-spacing:-0.02em;">
      <span style="display:inline-flex; flex-direction:column; gap:2px; width:20px; flex:0 0 auto;"><span style="display:flex; gap:1.5px;"><span style="flex:1; height:4px; background:#1A1714;"></span><span style="flex:1; height:4px; background:#D9714E;"></span><span style="flex:1; height:4px; background:#1A1714;"></span><span style="flex:1; height:4px; background:#1A1714;"></span></span><span style="position:relative; height:14px; border:2px solid #1A1714; border-radius:3px;"><span style="position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:6px; height:7px; background:#1A1714; border-radius:1px 1px 0 0;"></span></span></span><span>Thyra</span>
    </div>
    <div style="flex:1;"></div>
    <a href="Thyra Landing Page.dc.html" style="font-size:13px; color:var(--grey);">Back to home</a>
  </header>
  <section style="padding:120px 24px; text-align:center;">
    <span style="display:inline-flex; align-items:center; gap:8px; padding:7px 15px; border:1px solid var(--line); border-radius:999px; font-size:12px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--grey);"><span style="width:6px; height:6px; border-radius:50%; background:var(--terra);"></span>Coming soon</span>
    <h1 style="font-family:var(--hd); font-weight:700; letter-spacing:-0.03em; font-size:clamp(32px,5vw,52px); margin:24px auto 0; max-width:640px;">The pre-call qualifier is on its way.</h1>
    <p style="font-size:17px; color:var(--grey); max-width:520px; margin:18px auto 0;">This short form will confirm fit before booking — coming next.</p>
  </section>
</div>
</x-dc>
</body>
</html>
