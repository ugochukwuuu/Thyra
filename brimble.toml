# Brimble deploy settings. This app is one Node web service: Express serves the API and the
# built React app together. Brimble gives the server its port through the PORT variable.
# Secrets (database URL, JWT secret, API keys) are set in Brimble's dashboard, not here.

[services.web]
type = "web"

[services.web.build]
install = "npm install"
command = "npm run build"
runtime = { node = "22" }

[services.web.deploy]
start = "npm start"
health = "/api/health"

[services.web.env]
NODE_ENV = "production"
